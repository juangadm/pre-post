name: pre-post
description: Pre and Post screenshots of the pages a pull request changed, built on the runner and posted at the top of the PR.
author: juangadm
branding:
  icon: image
  color: gray-dark

inputs:
  github-token:
    description: Publishes the images and edits the PR. Needs contents and pull-requests write.
    default: ${{ github.token }}
  args:
    description: Extra flags for `pre-post pr`, such as --responsive or --routes /a,/b.
    default: ''
  cli:
    description: How pre-post is invoked. Leave empty to run the version this action revision ships; set it only to test an unreleased build.
    default: ''

runs:
  using: composite
  steps:
    # Only for a project that pins its package manager ("packageManager" in
    # package.json). Without a pin corepack hands out the newest release, and
    # a pnpm a major version ahead of the one the lockfile was written with
    # reinstalls the tree instead of running the dev server — which is how
    # this step, run unconditionally, broke the first run. An unpinned project
    # sets its package manager up before this action, as for any other job.
    - name: Package manager
      shell: bash
      run: |
        if node -e "process.exit(require('./package.json').packageManager ? 0 : 1)" 2>/dev/null; then
          corepack enable
        fi

    # --local: build both sides on the runner. A preview deployment is often
    # behind a login the job cannot pass (Vercel protects previews by
    # default), and getting past it takes a secret in every project.
    #
    # --require-pr: nothing to do for a commit with no open PR.
    #
    # GITHUB_TOKEN, not GH_TOKEN: on a refusal pre-post then names the
    # workflow's permissions block, which is the fix inside a runner.
    - name: Pre and Post
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PRE_POST_CLI: ${{ inputs.cli }}
        PRE_POST_ARGS: ${{ inputs.args }}
        # corepack would otherwise wait for a yes before its first download.
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # The npm release matching this action revision's package.json, never
      # `latest`: a workflow pinned to @v1 or a SHA must not start running
      # different code, with a write-scoped token, when a new version ships.
      run: |
        cli="$PRE_POST_CLI"
        if [ -z "$cli" ]; then
          version=$(node -p "require(process.env.GITHUB_ACTION_PATH + '/package.json').version")
          cli="npx -y @juangadm/pre-post@$version"
        fi
        $cli pr --local --require-pr -o "$RUNNER_TEMP/pre-post" $PRE_POST_ARGS

    # Kept even when posting fails, so the screenshots and sheet.png can be
    # downloaded from the run.
    - name: Keep the screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pre-post
        path: ${{ runner.temp }}/pre-post
        if-no-files-found: ignore
