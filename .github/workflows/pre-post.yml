name: pre-post

# Runs on each push to a PR that touches the site, builds the base commit
# and this PR's commit on the runner, and posts Pre and Post to the PR. No
# preview deployment is involved, so nothing per project has to be set up.
on:
  pull_request:
    paths:
      - 'site/**'
      - 'action.yml'
      - '.github/workflows/pre-post.yml'

permissions:
  contents: write       # the pre-post-assets branch
  pull-requests: write  # the PR description

concurrency:
  group: pre-post-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pre-post:
    # A fork's PR gets a read-only token, so there would be nowhere to post.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR's own commit, not GitHub's merge of it into main, so Post
          # is exactly what the author pushed.
          ref: ${{ github.event.pull_request.head.sha }}
          # The route detection diffs against main, so it needs main's history.
          fetch-depth: 0

      # This repository is pre-post itself, so it runs the build from this
      # checkout rather than the published package. Other repositories only
      # need the `uses: juangadm/pre-post@v1` step.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: ./
        with:
          cli: node dist/bin/cli.js
