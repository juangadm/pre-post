name: Hint probe (temporary)

on: push

jobs:
  via-github-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: doctor and pr on the job's own GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node dist/bin/cli.js doctor 2>&1 | grep github
          start=$(date +%s%3N)
          node dist/bin/cli.js pr --routes / 2>&1 | tail -2
          echo "exit=${PIPESTATUS[0]} elapsed_ms=$(( $(date +%s%3N) - start ))"

  via-gh-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: the same token, supplied as GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node dist/bin/cli.js pr --routes / 2>&1 | tail -2
          echo "exit=${PIPESTATUS[0]}"
