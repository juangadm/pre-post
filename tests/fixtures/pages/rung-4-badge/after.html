<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pricing</title>
<style>
body{margin:0;font:16px/1.6 system-ui,-apple-system,sans-serif;background:#fff;color:#111}
main{padding:48px 40px;max-width:760px}
h1{font-size:32px;margin:0 0 16px}
p{color:#444;margin:0 0 16px}
.icon{display:inline-block;width:16px;height:16px;border-radius:3px;background:#2563eb;vertical-align:-2px}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;background:#fde68a;color:#111;font-size:13px}
.btn{display:inline-block;margin-top:20px;padding:12px 22px;border-radius:8px;background:#2563eb;color:#fff;font-weight:600}
.section{margin-top:32px;padding:24px;border:1px solid #e5e7eb;border-radius:12px;background:#fff}
</style>
</head>
<body>
<main>
<h1>Pricing</h1>
<p><span class="icon"></span> Plans for teams of every size.</p>
<p class="copy">Start free and upgrade when you need more seats.</p>
<p><span class="badge">Beta</span></p>
<a class="btn" href="#">Get started</a>
<div class="section"><p>Everything in Free, plus priority support.</p></div>
</main>
</body>
</html>
